<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link
            rel="icon"
            type="image/png"
            href="/icon.png"
        />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <script>
            var Module;
            // Apply theme from localStorage before React renders to prevent flash
            try {
                var __t = localStorage.getItem('theme');
                if (__t === 'dark' || __t === 'light') {
                    document.documentElement.classList.add(__t);
                } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.add('dark');
                }
            } catch(e) {}
        </script>
        <title>Pot</title>
    </head>

    <body>
        <div id="root"></div>
        <script
            type="module"
            src="/src/main.jsx"
        ></script>
    </body>
</html>
